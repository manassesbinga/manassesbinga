    @keyframes fall6  { 0%{transform:translateY(-130px)} 100%{transform:translateY(130px)} }
    @keyframes fall7  { 0%{transform:translateY(-130px)} 100%{transform:translateY(130px)} }
    @keyframes fall8  { 0%{transform:translateY(-130px)} 100%{transform:translateY(130px)} }
