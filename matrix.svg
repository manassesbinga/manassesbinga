    .col0  { animation: fall0  2.1s linear infinite; }
    .col1  { animation: fall1  1.7s linear infinite; }
    .col2  { animation: fall2  2.4s linear infinite; }
    .col3  { animation: fall3  1.5s linear infinite; }
    .col4  { animation: fall4  2.8s linear infinite; }
    .col5  { animation: fall5  1.9s linear infinite; }
    .col6  { animation: fall6  2.2s linear infinite; }
    .col7  { animation: fall7  1.6s linear infinite; }
    .col8  { animation: fall8  2.6s linear infinite; }
