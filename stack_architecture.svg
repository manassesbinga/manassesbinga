<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" width="780" height="700">
<defs>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff06" stroke-width="0.5"/>
  </pattern>
  <linearGradient id="scangrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00ccff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00ccff" stop-opacity="1"/>
    <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
  </linearGradient>
  <style>
    .tag{font-size:9px;fill:#ffffff55;font-family:monospace;letter-spacing:2px;}
    .ybadge{font-size:9px;font-family:monospace;font-weight:bold;}
    .ntitle{font-size:11px;font-family:monospace;font-weight:bold;}
    .nsub{font-size:9px;font-family:monospace;}
    @keyframes flow{0%{stroke-dashoffset:200;}100%{stroke-dashoffset:0;}}
    @keyframes pulse{0%,100%{r:6;}50%{r:9;}}
    @keyframes scanmove{0%{transform:translateY(-60px);}100%{transform:translateY(760px);}}
    @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
    .fl{stroke-dasharray:6 4;animation:flow 2s linear infinite;fill:none;}
    .dot1{animation:pulse 2s ease-in-out infinite;}
    .dot2{animation:pulse 2.2s ease-in-out 0.3s infinite;}
    .dot3{animation:pulse 1.8s ease-in-out 0.6s infinite;}
    .dot4{animation:pulse 2.4s ease-in-out 0.9s infinite;}
    .dot5{animation:pulse 2s ease-in-out 1.2s infinite;}
    .dotnow{animation:pulse 1.5s ease-in-out infinite;}
    .cursor{animation:blink 0.8s step-end infinite;}
    .beam{animation:scanmove 4s linear infinite;}
  </style>
</defs>
<rect width="780" height="700" fill="#09090f"/>
<rect width="780" height="700" fill="url(#grid)"/>
<rect class="beam" x="0" y="0" width="780" height="60" fill="url(#scangrad)" opacity="0.06"/>
<rect x="10" y="10" width="760" height="680" fill="none" stroke="#00ccff22" stroke-width="1" rx="8"/>
